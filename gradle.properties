org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Minecraft / Forge(このフォルダは Forge 1.20.1 版。本流の 1.21.1 NeoForge 版は ../../overgrown/parasitica/parasitica)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# Forge のバージョン。存在するバージョンは https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.26
forge_version_range=[47,)
loader_version_range=[47,)

## Parchment (パラメータ名マッピング)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

## GeckoLib (Blockbench製モデル/アニメーションを読み込むためのライブラリ)
# 1.20.1 Forge 向けの版。https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-forge-1.20.1/maven-metadata.xml
# 1.21.1 版は 4.7.6。4.8 系との API の違いは移植のときに確かめる。
geckolib_version=4.8.4

## MixinExtras(jar に同梱する)。https://repo1.maven.org/maven2/io/github/llamalad7/mixinextras-forge/
mixinextras_version=0.5.5

## Mod
mod_id=overgrown_vegetation
mod_name=Overgrown Vegetation
mod_license=MIT (code) / All Rights Reserved (assets)
mod_version=0.2.0-alpha
mod_group_id=com.yayuy.overgrownvegetation
mod_authors=yayuy
mod_description=Parasitic flora that corrupts and overgrows the world.

## 本流(1.21.1)のフォルダ。素材(絵・モデル・アニメ・音)は git の外なので、ここから写す(syncAssetsFrom121)
