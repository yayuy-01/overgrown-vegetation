buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // 配布 jar を縮める後処理(reobfJar の後の JarShrink)で、クラスの局所変数の表を外すのに使う(本流と同じ)
        classpath 'org.ow2.asm:asm:9.7'
    }
}

// Overgrown Vegetation — Forge 1.20.1 版(2026-10-10 に土台を作成)。
// 本流は 1.21.1 NeoForge 版(../../overgrown/parasitica/parasitica)。こちらは公開のたびに本流から機能を移す。
// ビルドは ModDevGradle の legacyforge プラグイン(Forge 1.17〜1.20.1 用。reobf と mixin の refmap を作る)。
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.78'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge"
}

// 1.20.1 の遊び手は Java 17。手元に無ければ foojay(settings.gradle)が自動で取ってくる。
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// ── 移植済みのソースだけをコンパイルする ──
// このブランチの src/main/java には、まだ 1.21.1 のままのクラスも残っている(移植の元として同じ場所に置いてある)。
// ported-sources.txt に書いたパス(Ant 形式。com/yayuy/... から)だけをコンパイルし、移植した分だけ増やす。
// 全部を移し終えたら、このブロックとファイルを消す。
// 2026-11-23: 組ごとの一覧 ported-sources.d/*.txt も読む(統合のとき、組ごとに足していけるように。書き方は同じ)
def portedSourceFiles = [file('ported-sources.txt')] + (file('ported-sources.d').listFiles()?.findAll { it.name.endsWith('.txt') }?.sort() ?: [])
def portedLines = portedSourceFiles.collectMany { it.readLines('UTF-8') }
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') }
// 2026-11-23 統合 I: 頭に ! の行は外す物(G8 の gametest が移し終わるまで外す)
sourceSets.main.java.include(portedLines.findAll { !it.startsWith('!') })
sourceSets.main.java.exclude(portedLines.findAll { it.startsWith('!') }.collect { it.substring(1) })

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // GameTest(自動テスト)。gradlew.bat runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // 2026-11-23 統合 I: ゲームフォルダは環境変数 OV_GT_DIR(例 runs/gt_g8)で変えられる。無ければ MDG の既定(run/)
            if (System.getenv('OV_GT_DIR')) gameDirectory = project.file(System.getenv('OV_GT_DIR'))
        }
        // Claude が自分で起動して確かめる用のクライアント。ゲームフォルダは runs/claude(環境変数 OV_CC_DIR で変えられる。本流と同じ)。
        // ./gradlew runClaudeClient -Dov.autoQuit=title で、タイトル画面に着いたら自分で終わる(port/dev/AutoQuit。ユーザーの決定 12)
        claudeClient {
            client()
            gameDirectory = project.file(System.getenv('OV_CC_DIR') ?: 'runs/claude')
            systemProperty 'ov.devbridge', 'true'
            systemProperty 'ov.autoQuit', System.getProperty('ov.autoQuit', '')
            // 2026-11-23 統合 I: -Dov.mixinCount=true で mixin の注入の数を数える(require 0 の外れも起動で分かる。G7 の報告。配る版には付けない)
            if (Boolean.getBoolean('ov.mixinCount')) systemProperty 'mixin.debug.countInjections', 'true'
            programArguments.addAll('--width', '1280', '--height', '720')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mixin: 1.20.1 の Forge は実行時の名前が SRG なので、refmap を作って jar に入れる。
mixin {
    // mixin が 1 つも無いと注釈処理が refmap の対応表を作らず reobfJar が落ちる(2026-10-10)。
    // 2026-11-23 から互換の層の mixin(port.mixins.json、F の持ち物)があるので戻した。本流の mixin は mixins.json(G7)
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.port.mixins.json"
}

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // mod の依存は SRG の名前で配られているので、mod〜 の構成で開発用の名前に直して読む(推移的には引かない)
    modImplementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    // MixinExtras(@WrapOperation など。本流の mixin 27 個が使う)。1.20.1 の Forge には入っていないので jar に同梱する
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")
    jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")
    // @Nullable など(本流は NeoForge の推移的な依存で読めていた。1.20.1 の Forge の開発環境には入っていない)
    compileOnly 'org.jetbrains:annotations:24.1.0'
    // 2026-11-23: playerAnimator は外した(本流の Java から PAL が消えた。計画 §5 の 8)
}

// ── 素材を本流(1.21.1)から写す ──
// 絵・モデル・アニメ・音は git の外(.gitignore)なので、このブランチには入っていない。
// 公開のための移植のときに、その時点の本流の素材を写す(写した後は本流を変えてもここは変わらない)。
//   gradlew.bat syncAssetsFrom121
// 素材のフォルダがまだ無いときだけは、ビルドの前に自動で写す。
def assetDirs = ['textures', 'models', 'geo', 'animations', 'sounds']
def assetsHere = 'src/main/resources/assets/overgrown_vegetation'
def syncAssets = tasks.register('syncAssetsFrom121', Sync) {
    group = 'overgrown'
    description = '本流(1.21.1)の素材フォルダ 5 つを、このブランチの assets へ写す'
    from(file("${ov121_dir}/src/main/resources/assets/overgrown_vegetation")) {
        include assetDirs.collect { "${it}/**" }
    }
    into file(assetsHere)
    // 6 つのフォルダの外(blockstates・lang など git で追跡しているもの)は消さない
    preserve {
        include '**'
        exclude assetDirs.collect { "${it}/**" }
    }
    onlyIf { !file("${assetsHere}/textures").exists() || gradle.startParameter.taskNames.any { it.endsWith('syncAssetsFrom121') } }
}
tasks.named('processResources', ProcessResources) {
    dependsOn syncAssets

    // META-INF/mods.toml の版などを gradle.properties から埋める
    def props = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range  : forge_version_range,
            loader_version_range : loader_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    // GameTest と Claude 用の操作口は開発用なので配布 jar から外す(1.21.1 版と同じ)
    exclude 'com/yayuy/overgrownvegetation/gametest/**'
    exclude 'data/overgrown_vegetation/structures/gametest_*'
    exclude 'com/yayuy/overgrownvegetation/devbridge/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // 1.20.1 の Forge は mods.toml の [[mixins]] を読まない。jar の manifest で知らせる
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.port.mixins.json"
        ])
    }
}

// GameTest のサーバーを 1.21 のテストサーバーと同じ平らな世界・NORMAL で作る(2026-11-23 統合 I。G8 の init スクリプトから移した)。
// Forge 1.20.1 の runGameTestServer は普通のサーバーの起動で、世界は server.properties の level-type で作る(既定 normal = テストの場が地下・上に海)。
// ゲームのルールは gametest/GtServerSetup(G8)。OV_GT_DIR が runs/gt_* のときは、流す前に world を消して毎回新しい世界で流す(OV_GT_KEEP_WORLD=1 で残す)。
tasks.matching { it.name == 'runGameTestServer' }.configureEach { t ->
    t.doFirst {
        File dir = t.gameDirectory.get().asFile.canonicalFile
        boolean ours = dir.name.startsWith('gt_') && dir.parentFile != null && dir.parentFile.name == 'runs'
        File world = new File(dir, 'world')
        if (ours && world.isDirectory() && System.getenv('OV_GT_KEEP_WORLD') != '1') {
            logger.lifecycle(world.deleteDir() ? "OV_GT 前の回のワールドを消した: ${world}" : "OV_GT 前の回のワールドを消し切れなかった(使用中?): ${world}")
        }
        dir.mkdirs()
        File props = new File(dir, 'server.properties')
        List<String> lines = props.isFile() ? props.readLines('UTF-8').findAll { !it.startsWith('level-type=') && !it.startsWith('difficulty=') } : []
        lines << 'level-type=minecraft\\:flat'
        lines << 'difficulty=normal'
        props.write(lines.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("OV_GT ${dir}: server.properties に level-type=flat・difficulty=normal")
    }
}

// 配布 jar を縮める後処理(2026-11-23 統合 I。中身は本流の build.gradle と同じ JarShrink)。見た目と動作は変えない。
// 1.20.1 は reobfJar の出力(build/libs、SRG の名前)が配る jar なので、その後に掛ける(jar タスクに掛けると難読化前の jar を縮める)。
//   クラス: 局所変数の表を外す。行番号は残る。PNG: 画素が 1 つも変わらないことを確かめたうえで強く圧縮し直す。
tasks.named('reobfJar').configure {
    doLast {
        File jarFile = outputs.files.singleFile
        File tmp = new File(jarFile.parentFile, jarFile.name + '.shrinking')
        long before = jarFile.length()
        def zin = new java.util.zip.ZipFile(jarFile)
        try {
            tmp.withOutputStream { os ->
                def zout = new java.util.zip.ZipOutputStream(os)
                zout.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
                for (java.util.zip.ZipEntry e in java.util.Collections.list(zin.entries())) {
                    byte[] bytes = zin.getInputStream(e).bytes
                    if (e.name.endsWith('.class')) bytes = JarShrink.stripLocals(bytes)
                    else if (e.name.endsWith('.png')) bytes = JarShrink.recompressPng(bytes)
                    def out = new java.util.zip.ZipEntry(e.name)
                    out.time = e.time
                    zout.putNextEntry(out)
                    zout.write(bytes)
                    zout.closeEntry()
                }
                zout.finish()
            }
        } finally {
            zin.close()
        }
        java.nio.file.Files.move(tmp.toPath(), jarFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("jar shrink: ${(long) (before / 1024)} KB -> ${(long) (jarFile.length() / 1024)} KB (${jarFile.name})")
    }
}

// 配布 jar を縮める後処理の中身(上の reobfJar の doLast から呼ぶ。本流の build.gradle からそのまま写した)。
@groovy.transform.CompileStatic
class JarShrink {
    /** 局所変数の表(LocalVariableTable / LocalVariableTypeTable)だけを外す。命令・行番号・フレームはそのまま。 */
    static byte[] stripLocals(byte[] cls) {
        def reader = new org.objectweb.asm.ClassReader(cls)
        def writer = new org.objectweb.asm.ClassWriter(0)
        reader.accept(new LocalsStripper(writer), 0)
        return writer.toByteArray()
    }

    /**
     * 8 bit RGBA の PNG を強く圧縮し直す。256 色以下で透明を含むならパレットにする
     * (透明を含むパレットは読み込み側で今まで通り RGBA になる)。画素が 1 つでも変わるなら元のまま返す。
     * RGBA 以外の形式は、読み込み側の形式(RGB・グレー)が変わりうるので触らない。
     */
    static byte[] recompressPng(byte[] orig) {
        if (orig.length < 33 || orig[24] != (byte) 8 || orig[25] != (byte) 6) return orig
        java.awt.image.BufferedImage img = javax.imageio.ImageIO.read(new ByteArrayInputStream(orig))
        if (img == null) return orig
        int w = img.width
        int h = img.height
        int[] px = img.getRGB(0, 0, w, h, null, 0, w)
        def argb = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        argb.setRGB(0, 0, w, h, px, 0, w)
        byte[] best = orig
        byte[] candidate = writePng(argb)
        if (candidate.length < best.length) best = candidate
        java.awt.image.BufferedImage indexed = toIndexed(px, w, h)
        if (indexed != null) {
            candidate = writePng(indexed)
            if (candidate.length < best.length) best = candidate
        }
        if (best.is(orig)) return orig
        java.awt.image.BufferedImage back = javax.imageio.ImageIO.read(new ByteArrayInputStream(best))
        return Arrays.equals(px, back.getRGB(0, 0, w, h, null, 0, w)) ? best : orig
    }

    private static byte[] writePng(java.awt.image.RenderedImage img) {
        javax.imageio.ImageWriter writer = javax.imageio.ImageIO.getImageWritersByFormatName('png').next()
        javax.imageio.ImageWriteParam param = writer.defaultWriteParam
        param.compressionMode = javax.imageio.ImageWriteParam.MODE_EXPLICIT
        param.compressionQuality = 0.0f
        def bytes = new ByteArrayOutputStream()
        def out = javax.imageio.ImageIO.createImageOutputStream(bytes)
        try {
            writer.output = out
            writer.write(null, new javax.imageio.IIOImage(img, null, null), param)
        } finally {
            out.close()
            writer.dispose()
        }
        return bytes.toByteArray()
    }

    private static java.awt.image.BufferedImage toIndexed(int[] px, int w, int h) {
        Map<Integer, Integer> index = new LinkedHashMap<>()
        boolean alpha = false
        for (int c in px) {
            if ((c >>> 24) != 0xFF) alpha = true
            if (!index.containsKey(c)) {
                if (index.size() == 256) return null
                index.put(c, index.size())
            }
        }
        if (!alpha) return null
        int n = index.size()
        byte[] r = new byte[n]
        byte[] g = new byte[n]
        byte[] b = new byte[n]
        byte[] a = new byte[n]
        for (Map.Entry<Integer, Integer> e in index.entrySet()) {
            int c = e.key.intValue()
            int i = e.value.intValue()
            a[i] = (byte) (c >>> 24)
            r[i] = (byte) (c >> 16)
            g[i] = (byte) (c >> 8)
            b[i] = (byte) c
        }
        def cm = new java.awt.image.IndexColorModel(8, n, r, g, b, a)
        def out = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_BYTE_INDEXED, cm)
        java.awt.image.WritableRaster raster = out.raster
        for (int y = 0; y < h; y++) {
            for (int x = 0; x < w; x++) raster.setSample(x, y, 0, index.get(px[y * w + x]).intValue())
        }
        return out
    }
}

@groovy.transform.CompileStatic
class LocalsStripper extends org.objectweb.asm.ClassVisitor {
    LocalsStripper(org.objectweb.asm.ClassVisitor next) {
        super(org.objectweb.asm.Opcodes.ASM9, next)
    }

    @Override
    org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
        return new LocalsDropper(super.visitMethod(access, name, descriptor, signature, exceptions))
    }
}

@groovy.transform.CompileStatic
class LocalsDropper extends org.objectweb.asm.MethodVisitor {
    LocalsDropper(org.objectweb.asm.MethodVisitor next) {
        super(org.objectweb.asm.Opcodes.ASM9, next)
    }

    @Override
    void visitLocalVariable(String name, String descriptor, String signature,
                            org.objectweb.asm.Label start, org.objectweb.asm.Label end, int index) {
    }

    @Override
    org.objectweb.asm.AnnotationVisitor visitLocalVariableAnnotation(int typeRef, org.objectweb.asm.TypePath typePath,
                                                                     org.objectweb.asm.Label[] start, org.objectweb.asm.Label[] end,
                                                                     int[] index, String descriptor, boolean visible) {
        return null
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
