// Overgrown Vegetation — Forge 1.20.1 版(2026-10-10 に土台を作成)。
// 本流は 1.21.1 NeoForge 版(../../overgrown/parasitica/parasitica)。こちらは公開のたびに本流から機能を移す。
// ビルドは ModDevGradle の legacyforge プラグイン(Forge 1.17〜1.20.1 用。reobf と mixin の refmap を作る)。
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.78'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge"
}

// 1.20.1 の遊び手は Java 17。手元に無ければ foojay(settings.gradle)が自動で取ってくる。
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// ── 移植済みのソースだけをコンパイルする ──
// このブランチの src/main/java には、まだ 1.21.1 のままのクラスも残っている(移植の元として同じ場所に置いてある)。
// ported-sources.txt に書いたパス(Ant 形式。com/yayuy/... から)だけをコンパイルし、移植した分だけ増やす。
// 全部を移し終えたら、このブロックとファイルを消す。
def portedSources = file('ported-sources.txt').readLines('UTF-8')
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') }
sourceSets.main.java.include(portedSources)

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // GameTest(自動テスト)。gradlew.bat runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        // Claude が自分で起動して確かめる用のクライアント。ゲームフォルダは runs/claude。
        claudeClient {
            client()
            gameDirectory = project.file('runs/claude')
            systemProperty 'ov.devbridge', 'true'
            programArguments.addAll('--width', '1280', '--height', '720')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mixin: 1.20.1 の Forge は実行時の名前が SRG なので、refmap を作って jar に入れる。
mixin {
    // 【最初の mixin を移したら戻す】mixin が 1 つも無いと注釈処理が refmap の対応表(build/mixin/*.mappings.tsrg)を作らず、
    // それを読みにいく reobfJar が落ちる(2026-10-10 に確認)。今は mixins.json が空なので外してある。
    // add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
    maven {
        name = 'KosmX' // playerAnimator
        url = 'https://maven.kosmx.dev/'
        content {
            includeGroup('dev.kosmx.player-anim')
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // mod の依存は SRG の名前で配られているので、mod〜 の構成で開発用の名前に直して読む(推移的には引かない)
    modImplementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    // プレイヤーの体を動かすアニメ(寄生植物装備の儀式)。1.21.1 版の PAL の代わり
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
}

// ── 素材を本流(1.21.1)から写す ──
// 絵・モデル・アニメ・音は git の外(.gitignore)なので、このブランチには入っていない。
// 公開のための移植のときに、その時点の本流の素材を写す(写した後は本流を変えてもここは変わらない)。
//   gradlew.bat syncAssetsFrom121
// 素材のフォルダがまだ無いときだけは、ビルドの前に自動で写す。
def assetDirs = ['textures', 'models', 'geo', 'animations', 'player_animations', 'sounds']
def assetsHere = 'src/main/resources/assets/overgrown_vegetation'
def syncAssets = tasks.register('syncAssetsFrom121', Sync) {
    group = 'overgrown'
    description = '本流(1.21.1)の素材フォルダ 6 つを、このブランチの assets へ写す'
    from(file("${ov121_dir}/src/main/resources/assets/overgrown_vegetation")) {
        include assetDirs.collect { "${it}/**" }
    }
    into file(assetsHere)
    // 6 つのフォルダの外(blockstates・lang など git で追跡しているもの)は消さない
    preserve {
        include '**'
        exclude assetDirs.collect { "${it}/**" }
    }
    onlyIf { !file("${assetsHere}/textures").exists() || gradle.startParameter.taskNames.any { it.endsWith('syncAssetsFrom121') } }
}
tasks.named('processResources', ProcessResources) {
    dependsOn syncAssets

    // META-INF/mods.toml の版などを gradle.properties から埋める
    def props = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range  : forge_version_range,
            loader_version_range : loader_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }

    // data/ は 1.21.1 の書き方のまま(フォルダ名が単数形・レシピの result など)。
    // 1.20.1 の書き方へ直したものを入れるまで、jar にも runClient にも載せない。
    exclude 'data/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    // GameTest と Claude 用の操作口は開発用なので配布 jar から外す(1.21.1 版と同じ)
    exclude 'com/yayuy/overgrownvegetation/gametest/**'
    exclude 'data/overgrown_vegetation/structures/gametest_*'
    exclude 'com/yayuy/overgrownvegetation/devbridge/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // 1.20.1 の Forge は mods.toml の [[mixins]] を読まない。jar の manifest で知らせる
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
