[[mods]]
modId = "overgrown_vegetation"
version = "0.1.0"
displayName = "Overgrown Vegetation"
authors = "yayuy"
description = '''
寄生植物が世界を侵食していく MOD。

第一段階では巨大シダの寄生植物 (Blight Fern) を追加します。
この Mob を起点に、半径 30 ブロックの球状範囲が徐々に汚染ブロックへ置き換わっていきます。
まず露出面のあるブロックが置き換わり、その後で内部のブロックも置き換わります。
'''

[[mixins]]
config = "overgrown_vegetation.mixins.json"

[[dependencies.overgrown_vegetation]]
